[project]
name = "authorization-transition-closure"
version = "0.1.0"
description = "Research prototype for verifying authorization-to-transition closure"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=45,<47",
  "rfc8785>=0.1.4,<0.2",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
